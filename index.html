<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Open World Prototype</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        background: #101014;
        overflow: hidden;
        height: 100%;
      }
      #app {
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100vh;
      }
      .hidden {
        display: none !important;
      }
      #dialogue-box {
        position: fixed;
        left: 50%;
        bottom: 32px;
        transform: translateX(-50%);
        width: min(560px, 90vw);
        background: #14141ce6;
        border: 2px solid #5b4a2f;
        border-radius: 10px;
        padding: 12px 16px;
        color: #f5f0e6;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
        z-index: 10;
      }
      #dialogue-name {
        font-weight: 700;
        font-size: 15px;
        margin-bottom: 8px;
        color: #f5c518;
      }
      #dialogue-log {
        max-height: 160px;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 6px;
        margin-bottom: 10px;
      }
      .dialogue-msg {
        font-size: 14px;
        line-height: 1.4;
      }
      .dialogue-msg.player {
        color: #9fc6ff;
      }
      .dialogue-msg.npc {
        color: #f5f0e6;
      }
      #dialogue-input {
        width: 100%;
        box-sizing: border-box;
        padding: 8px 10px;
        border-radius: 6px;
        border: 1px solid #5b4a2f;
        background: #232330;
        color: #f5f0e6;
        font-size: 14px;
        outline: none;
      }
      #dialogue-input:disabled {
        opacity: 0.6;
      }
      #elevator-panel {
        position: fixed;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        width: min(380px, 90vw);
        background: #1b1b22e6;
        border: 3px solid #888;
        border-radius: 10px;
        padding: 16px;
        color: #f5f0e6;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
        z-index: 10;
      }
      #elevator-title {
        font-weight: 700;
        font-size: 14px;
        margin-bottom: 10px;
        text-align: center;
        color: #f5c518;
      }
      #elevator-floor-list {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 6px;
        max-height: 55vh;
        overflow-y: auto;
      }
      .elevator-btn {
        padding: 8px 0;
        border-radius: 6px;
        border: 1px solid #555;
        background: #2e86de;
        color: #fff;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
      }
      .elevator-btn.basement {
        background: #4a4a55;
      }
      .elevator-btn.current {
        outline: 2px solid #f5c518;
        outline-offset: 1px;
      }
      .elevator-btn:hover {
        filter: brightness(1.15);
      }
      #elevator-hint {
        margin-top: 10px;
        font-size: 12px;
        color: #aaa;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="dialogue-box" class="hidden">
      <div id="dialogue-name"></div>
      <div id="dialogue-log"></div>
      <input id="dialogue-input" type="text" placeholder="말하기 (Enter 전송 / Esc 닫기)" />
    </div>
    <div id="elevator-panel" class="hidden">
      <div id="elevator-title">엘리베이터 · 현재 층: <span id="elevator-current"></span></div>
      <div id="elevator-floor-list"></div>
      <div id="elevator-hint">클릭해서 이동 · Esc로 닫기</div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
