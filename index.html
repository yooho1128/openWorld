<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>인생네컷: 오픈월드</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        background: #101014;
        overflow: hidden;
        height: 100%;
        overscroll-behavior: none;
        touch-action: none;
        font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif;
      }
      #stage {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100vh;
        height: 100dvh;
      }
      #app {
        line-height: 0;
      }
      #overlay {
        display: none;
        position: absolute;
        inset: 0;
        align-items: center;
        justify-content: center;
        background: rgba(10, 10, 14, 0.72);
        z-index: 10;
        padding: 16px;
        box-sizing: border-box;
      }
      #overlay .panel {
        background: #1d1d24;
        border: 1px solid #3a3a46;
        border-radius: 12px;
        padding: 20px;
        width: min(360px, 100%);
        max-height: 90%;
        overflow-y: auto;
        color: #f0f0f5;
        box-sizing: border-box;
      }
      #overlay h2 {
        margin: 0 0 12px;
        font-size: 18px;
      }
      #overlay label {
        display: block;
        font-size: 13px;
        margin: 10px 0 4px;
        color: #c7c7d6;
      }
      #overlay input, #overlay select, #overlay textarea {
        width: 100%;
        box-sizing: border-box;
        padding: 8px;
        border-radius: 6px;
        border: 1px solid #4a4a58;
        background: #2a2a33;
        color: #f0f0f5;
        font-size: 14px;
      }
      #overlay textarea {
        resize: vertical;
        min-height: 60px;
      }
      #overlay button {
        margin-top: 14px;
        width: 100%;
        padding: 10px;
        border: none;
        border-radius: 6px;
        background: #4f7cff;
        color: white;
        font-size: 14px;
        font-weight: bold;
        cursor: pointer;
      }
      #overlay button.secondary {
        background: #3a3a46;
        margin-top: 8px;
      }
      #overlay .error {
        color: #ff6b6b;
        font-size: 12px;
        margin-top: 6px;
        min-height: 14px;
      }
      #overlay .chat-log {
        max-height: 200px;
        overflow-y: auto;
        margin-bottom: 8px;
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      #overlay .chat-line {
        font-size: 13px;
        background: #2a2a33;
        padding: 6px 8px;
        border-radius: 6px;
      }
      #overlay .chat-line.me {
        background: #3a4a7c;
        align-self: flex-end;
      }
    </style>
  </head>
  <body>
    <div id="stage">
      <div id="app"></div>
      <div id="overlay"></div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
