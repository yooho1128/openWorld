<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>에버글렌 연대기</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        background: radial-gradient(circle at 50% 30%, #263a32 0%, #0b100e 72%);
        overflow: hidden;
        height: 100%;
        overscroll-behavior: none;
        touch-action: none;
        font-family: Georgia, 'Malgun Gothic', 'Apple SD Gothic Neo', serif;
      }
      #stage {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100vh;
        height: 100dvh;
      }
      #app {
        line-height: 0;
        box-shadow: 0 0 0 2px #7d6038, 0 0 40px #000;
      }
      #overlay {
        display: none;
        position: absolute;
        inset: 0;
        align-items: center;
        justify-content: center;
        background: radial-gradient(circle, rgba(23, 18, 13, 0.68), rgba(5, 7, 6, 0.91));
        z-index: 10;
        padding: 16px;
        box-sizing: border-box;
      }
      #overlay .panel {
        position: relative;
        background:
          linear-gradient(rgba(255,255,255,.04), rgba(0,0,0,.08)),
          #d8c397;
        border: 3px solid #5b3d23;
        outline: 1px solid #cda75c;
        border-radius: 8px;
        padding: 24px;
        width: min(360px, 100%);
        max-height: 90%;
        overflow-y: auto;
        color: #2b2017;
        box-sizing: border-box;
        box-shadow: 0 18px 55px #000a, inset 0 0 35px #76511d33;
        line-height: 1.45;
      }
      #overlay .panel::before,
      #overlay .panel::after {
        content: '◆';
        position: absolute;
        top: 7px;
        color: #80602c;
        font-size: 11px;
      }
      #overlay .panel::before { left: 9px; }
      #overlay .panel::after { right: 9px; }
      #overlay p { font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif; }
      #overlay h2 {
        margin: 0 0 12px;
        font-size: 21px;
        color: #3b2717;
        text-align: center;
        letter-spacing: .04em;
        border-bottom: 1px solid #9e7b43;
        padding-bottom: 9px;
      }
      #overlay label {
        display: block;
        font-size: 13px;
        margin: 10px 0 4px;
        color: #5a432b;
        font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif;
        font-weight: 700;
      }
      #overlay input, #overlay select, #overlay textarea {
        width: 100%;
        box-sizing: border-box;
        padding: 8px;
        border-radius: 4px;
        border: 1px solid #755b38;
        background: #f4e7c7;
        color: #2b2017;
        font-size: 14px;
        font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif;
        box-shadow: inset 0 2px 5px #5e421624;
      }
      #overlay textarea {
        resize: vertical;
        min-height: 60px;
      }
      #overlay button {
        margin-top: 14px;
        width: 100%;
        padding: 10px;
        border: none;
        border-radius: 4px;
        border: 1px solid #d1a858;
        background: linear-gradient(#6d3f2d, #3d241d);
        color: #ffedbb;
        font-size: 14px;
        font-weight: bold;
        cursor: pointer;
        font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif;
        box-shadow: 0 3px 0 #24130e, inset 0 1px #ffffff25;
        transition: transform .12s, filter .12s;
      }
      #overlay button:hover { filter: brightness(1.14); transform: translateY(-1px); }
      #overlay button:active { transform: translateY(2px); box-shadow: 0 1px 0 #24130e; }
      #overlay button.secondary {
        background: linear-gradient(#536052, #313b32);
        margin-top: 8px;
      }
      #overlay .error {
        color: #8f231d;
        font-size: 12px;
        margin-top: 6px;
        min-height: 14px;
      }
      #overlay .chat-log {
        max-height: 200px;
        overflow-y: auto;
        margin-bottom: 8px;
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      #overlay .chat-line {
        font-size: 13px;
        background: #f0dfba;
        border: 1px solid #a98a56;
        padding: 6px 8px;
        border-radius: 6px;
      }
      #overlay .chat-line.me {
        background: #becb9c;
        border-color: #748451;
        align-self: flex-end;
      }
      .relationship { margin: 0 0 10px; padding: 6px 9px; border-radius: 4px; font: 700 12px 'Malgun Gothic', sans-serif; text-align: center; }
      .relationship.friendly { background: #b7c99c; color: #30401f; border: 1px solid #72814f; }
      .relationship.hostile { background: #d6a49a; color: #671f1c; border: 1px solid #9c554c; }
      .gold-line { font-size: 13px; text-align: center; color: #5d452b; }
      .trade-message { background: #fff0c6; border: 1px solid #a9874f; padding: 7px; border-radius: 4px; font-size: 12px; }
      .inventory-list, .companion-list { display: flex; flex-direction: column; gap: 7px; margin: 10px 0; }
      .inventory-row, .companion-card { display: flex; align-items: center; gap: 9px; padding: 8px; background: #ead8b1; border: 1px solid #a78955; border-radius: 5px; font-family: 'Malgun Gothic', sans-serif; }
      .inventory-row > div, .companion-copy { flex: 1; min-width: 0; }
      .inventory-row small, .companion-copy small { display: block; color: #6c573b; font-size: 10px; margin-top: 2px; }
      #overlay .inventory-row button, #overlay .companion-card button { width: auto; margin: 0; padding: 7px 9px; flex: 0 0 auto; font-size: 11px; }
      .companion-card.active { background: #c8d2ab; border-color: #718150; }
      .companion-avatar { width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; color: #fff0c6; font-weight: bold; border: 2px solid #5c4127; flex: 0 0 auto; }
      .npc-reply { margin: 12px 0; padding: 13px; background: #f4e6c5; border-left: 4px solid #886138; font: 14px/1.6 'Malgun Gothic', sans-serif; color: #34251a; }
      .choice-label, .thinking { font-size: 12px; color: #6b5134; text-align: center; }
      #overlay button.dialogue-choice { margin-top: 7px; text-align: left; background: linear-gradient(#5e4936, #3e2d22); }
      .conversation-count { display: block; margin-top: 10px; color: #826c4c; text-align: center; font-size: 10px; }
      .empty-state { text-align: center; color: #786447; font-size: 12px; padding: 18px 4px; }
      #overlay h3 { margin: 14px 0 6px; color: #4c3420; font-size: 14px; border-bottom: 1px solid #aa8954; padding-bottom: 4px; }
      .status-panel, .forge-panel, .inventory-panel { width: min(430px, 100%) !important; }
      .class-badge { margin: -5px auto 10px; width: fit-content; padding: 3px 12px; border: 1px solid #8d6a39; border-radius: 999px; background: #3b2b21; color: #ffe3a1; font-size: 11px; font-weight: 700; }
      .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; font: 11px 'Malgun Gothic', sans-serif; }
      .stat-grid span { padding: 6px 8px; background: #eddbb6; border: 1px solid #ac8b55; border-radius: 4px; }
      .equipped-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
      .equip-slot { position: relative; min-height: 43px; padding: 6px 7px; border: 1px solid #9b815c; border-radius: 5px; background: #e7d3ab; box-sizing: border-box; font-family: 'Malgun Gothic', sans-serif; }
      .equip-slot > span, .gear-card small, .forge-card small { display: block; color: #6d5a41; font-size: 9px; }
      .equip-slot > strong { display: block; margin-right: 39px; font-size: 10px; line-height: 1.3; }
      #overlay .equip-slot button { position: absolute; right: 5px; bottom: 5px; width: auto; margin: 0; padding: 3px 6px; font-size: 9px; }
      .gear-list, .forge-list { display: flex; flex-direction: column; gap: 7px; margin: 7px 0; }
      .gear-card, .forge-card { display: flex; align-items: center; gap: 8px; padding: 8px; border: 1px solid #9d835c; border-radius: 5px; background: #ead8b1; font-family: 'Malgun Gothic', sans-serif; }
      .gear-card > div, .forge-card > div { flex: 1; min-width: 0; }
      .gear-card strong, .forge-card strong { display: block; font-size: 11px; line-height: 1.35; }
      #overlay .gear-card button, #overlay .forge-card button { width: auto; flex: 0 0 auto; margin: 0; padding: 7px 8px; font-size: 10px; }
      .forge-actions { display: flex; flex-direction: column; gap: 5px; flex: 0 0 auto !important; }
      #overlay .forge-actions button.repair { background: linear-gradient(#4d725f, #29483a); border-color: #8fc29f; }
      #overlay button:disabled { filter: grayscale(.8); opacity: .52; cursor: not-allowed; }
      .forge-risk { margin-top: 3px; color: #8b332c !important; font-weight: 700; }
      .forge-message { padding: 8px; border-radius: 5px; border: 1px solid #a5844f; background: #f5e6bd; font-size: 12px; text-align: center; }
      .forge-message.success { color: #24532c; border-color: #638b58; background: #ccdbb0; }
      .forge-message.fail { color: #7a3328; border-color: #a96d59; background: #e5c1ae; }
      .forge-message.destroyed { color: #ffe0c2; border-color: #da4d3f; background: #542622; box-shadow: 0 0 18px #c6372c99; }
      .rarity-normal { border-color: #96938c !important; }
      .rarity-rare { border-color: #318dd8 !important; box-shadow: inset 3px 0 #4a9fe8; }
      .rarity-unique { border-color: #a447d2 !important; background: linear-gradient(105deg, #e8d5b0, #d9bee5) !important; box-shadow: inset 3px 0 #b45de0, 0 0 8px #a64ed455; }
      .rarity-legendary { border-color: #e78727 !important; background: linear-gradient(105deg, #ebd5a7, #edbf87) !important; box-shadow: inset 3px 0 #f09a38, 0 0 11px #e8792877; animation: rarityPulse 1.8s infinite alternate; }
      .rarity-mythic { border-color: #e8324a !important; background: linear-gradient(115deg, #ecc29b, #e9a9b2, #d9b9ea) !important; box-shadow: inset 3px 0 #ff4f5e, 0 0 14px #ff405e99; animation: rarityPulse 1s infinite alternate; }
      @keyframes rarityPulse { from { filter: brightness(.96); } to { filter: brightness(1.12); } }
      .quest-panel { width: min(430px, 100%) !important; }
      .quest-list, .milestone-list { display: flex; flex-direction: column; gap: 7px; margin: 8px 0; }
      .quest-card, .milestone-card { padding: 8px; border: 1px solid #9d835c; border-radius: 5px; background: #ead8b1; font-family: 'Malgun Gothic', sans-serif; }
      .quest-card strong, .milestone-card strong { display: block; font-size: 12px; margin-bottom: 3px; }
      .quest-card small, .milestone-card small { display: block; color: #6d5a41; font-size: 9px; }
      .quest-progress-track { position: relative; height: 12px; background: #c7ac7c; border: 1px solid #8a6d43; border-radius: 6px; margin: 5px 0; overflow: hidden; }
      .quest-progress-fill { position: absolute; inset: 0; width: 0%; background: linear-gradient(#7fae5a, #4f7f39); }
      .quest-progress-label { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 8px; color: #241d12; font-weight: 700; }
      .quest-card.done, .milestone-card.done { background: #c8d2ab; border-color: #718150; }
      .milestone-card.locked { opacity: .68; }
      #overlay .quest-card button, #overlay .milestone-card button { width: 100%; margin-top: 5px; }
      .quest-tabs { display: flex; gap: 6px; margin: 10px 0 4px; }
      .quest-tabs button { flex: 1; margin: 0 !important; }
      .quest-tabs button.inactive { background: linear-gradient(#4a3a2c, #2c2119) !important; opacity: .75; }
      .ranking-panel { width: min(430px, 100%) !important; }
      .rank-list { display: flex; flex-direction: column; gap: 6px; margin: 10px 0; max-height: 55vh; overflow-y: auto; }
      .rank-row { display: flex; align-items: center; gap: 10px; padding: 8px; border: 1px solid #9d835c; border-radius: 5px; background: #ead8b1; font-family: 'Malgun Gothic', sans-serif; }
      .rank-num { flex: 0 0 24px; text-align: center; font-weight: 700; font-size: 13px; color: #5a432b; }
      .rank-name { flex: 1; min-width: 0; }
      .rank-name strong { display: block; font-size: 12px; }
      .rank-name small { display: block; color: #6d5a41; font-size: 9px; margin-top: 1px; }
      .rank-value { flex: 0 0 auto; font-size: 11px; font-weight: 700; color: #4c3420; }
      .rank-top.rank-1 { background: linear-gradient(105deg, #f5dfa0, #eec161); border-color: #d19a2e; box-shadow: 0 0 10px #e8b53f66; }
      .rank-top.rank-2 { background: linear-gradient(105deg, #e6e6ea, #c7c9d1); border-color: #9a9ca6; }
      .rank-top.rank-3 { background: linear-gradient(105deg, #e8c5a6, #cf9a6f); border-color: #a9713f; }
      .rank-top .rank-num { font-size: 15px; }
      .rank-mine { outline: 2px solid #4a7fd1; }
    </style>
  </head>
  <body>
    <div id="stage">
      <div id="app"></div>
      <div id="overlay"></div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
