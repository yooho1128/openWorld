<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>에버글렌 연대기</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        background: radial-gradient(circle at 50% 30%, #263a32 0%, #0b100e 72%);
        overflow: hidden;
        height: 100%;
        overscroll-behavior: none;
        touch-action: none;
        font-family: Georgia, 'Malgun Gothic', 'Apple SD Gothic Neo', serif;
      }
      #stage {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100vh;
        height: 100dvh;
      }
      #app {
        line-height: 0;
        max-width: 100vw;
        max-height: 100dvh;
        overflow: hidden;
        border-radius: 10px;
        box-shadow: 0 0 0 2px #b9954e, 0 0 0 5px #26352d, 0 0 48px #000;
      }
      #app canvas { display: block; max-width: 100%; max-height: 100dvh; }
      #overlay {
        display: none;
        position: absolute;
        inset: 0;
        align-items: center;
        justify-content: center;
        background: radial-gradient(circle, rgba(23, 18, 13, 0.68), rgba(5, 7, 6, 0.91));
        z-index: 10;
        padding: 16px;
        box-sizing: border-box;
      }
      #overlay .panel {
        position: relative;
        background:
          linear-gradient(rgba(255,255,255,.04), rgba(0,0,0,.08)),
          #d8c397;
        border: 3px solid #5b3d23;
        outline: 1px solid #cda75c;
        border-radius: 8px;
        padding: 24px;
        width: min(360px, 100%);
        max-height: 90%;
        overflow-y: auto;
        color: #2b2017;
        box-sizing: border-box;
        box-shadow: 0 18px 55px #000a, inset 0 0 35px #76511d33;
        line-height: 1.45;
        touch-action: pan-y;
        overscroll-behavior: contain;
        -webkit-overflow-scrolling: touch;
        scrollbar-gutter: stable;
        overflow-wrap: anywhere;
        word-break: keep-all;
      }
      #overlay .panel::before,
      #overlay .panel::after {
        content: '◆';
        position: absolute;
        top: 7px;
        color: #80602c;
        font-size: 11px;
      }
      #overlay .panel::before { left: 9px; }
      #overlay .panel::after { right: 9px; }
      #overlay p { font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif; overflow-wrap: anywhere; }
      #overlay h2 {
        margin: 0 0 12px;
        font-size: 21px;
        color: #3b2717;
        text-align: center;
        letter-spacing: .04em;
        border-bottom: 1px solid #9e7b43;
        padding-bottom: 9px;
      }
      #overlay label {
        display: block;
        font-size: 13px;
        margin: 10px 0 4px;
        color: #5a432b;
        font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif;
        font-weight: 700;
      }
      #overlay input, #overlay select, #overlay textarea {
        width: 100%;
        box-sizing: border-box;
        padding: 8px;
        border-radius: 4px;
        border: 1px solid #755b38;
        background: #f4e7c7;
        color: #2b2017;
        font-size: 14px;
        font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif;
        box-shadow: inset 0 2px 5px #5e421624;
      }
      #overlay textarea {
        resize: vertical;
        min-height: 60px;
      }
      #overlay button {
        margin-top: 14px;
        width: 100%;
        padding: 10px;
        border: none;
        border-radius: 4px;
        border: 1px solid #d1a858;
        background: linear-gradient(#6d3f2d, #3d241d);
        color: #ffedbb;
        font-size: 14px;
        font-weight: bold;
        cursor: pointer;
        font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif;
        box-shadow: 0 3px 0 #24130e, inset 0 1px #ffffff25;
        transition: transform .12s, filter .12s;
      }
      #overlay button:hover { filter: brightness(1.14); transform: translateY(-1px); }
      #overlay button:active { transform: translateY(2px); box-shadow: 0 1px 0 #24130e; }
      #overlay button.secondary {
        background: linear-gradient(#536052, #313b32);
        margin-top: 8px;
      }
      #overlay .error {
        color: #8f231d;
        font-size: 12px;
        margin-top: 6px;
        min-height: 14px;
      }
      #overlay .chat-log {
        max-height: 200px;
        overflow-y: auto;
        margin-bottom: 8px;
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      #overlay .chat-line {
        font-size: 13px;
        background: #f0dfba;
        border: 1px solid #a98a56;
        padding: 6px 8px;
        border-radius: 6px;
      }
      #overlay .chat-line.me {
        background: #becb9c;
        border-color: #748451;
        align-self: flex-end;
      }
      .relationship { margin: 0 0 10px; padding: 6px 9px; border-radius: 4px; font: 700 12px 'Malgun Gothic', sans-serif; text-align: center; }
      .relationship.friendly { background: #b7c99c; color: #30401f; border: 1px solid #72814f; }
      .relationship.hostile { background: #d6a49a; color: #671f1c; border: 1px solid #9c554c; }
      .gold-line { font-size: 13px; text-align: center; color: #5d452b; }
      .trade-message { background: #fff0c6; border: 1px solid #a9874f; padding: 7px; border-radius: 4px; font-size: 12px; }
      .inventory-list, .companion-list { display: flex; flex-direction: column; gap: 7px; margin: 10px 0; }
      .rarity-group { display: flex; flex-direction: column; gap: 7px; margin: 0 0 11px; }
      .rarity-heading { position: sticky; top: -1px; z-index: 2; display: flex; justify-content: space-between; margin: 0; padding: 6px 9px; border: 1px solid #92764d; border-radius: 5px; background: #ddc89e; color: #4c3522; font: 700 11px 'Malgun Gothic', sans-serif; box-shadow: 0 2px 5px #523a1e33; }
      .rarity-heading span { font-weight: 400; opacity: .8; }
      #overlay button.bulk-sell { margin-top: 7px; background: linear-gradient(#a14b35, #65291f); border-color: #e3a263; }
      .inventory-row, .companion-card { display: flex; align-items: center; gap: 9px; padding: 8px; background: #ead8b1; border: 1px solid #a78955; border-radius: 5px; font-family: 'Malgun Gothic', sans-serif; }
      .inventory-row > div, .companion-copy { flex: 1; min-width: 0; }
      .inventory-row strong, .companion-copy strong, .gear-card strong, .forge-card strong,
      .rank-name strong, .quest-card strong, .milestone-card strong {
        overflow-wrap: anywhere;
        word-break: keep-all;
      }
      .potion-sell-actions { display: flex; gap: 4px; flex: 0 0 auto !important; }
      #overlay .potion-sell-actions button { width: auto; margin: 0; padding: 6px 7px; font-size: 10px; }
      .inventory-row small, .companion-copy small { display: block; color: #6c573b; font-size: 10px; margin-top: 2px; }
      .compare-badge { font-weight: 700 !important; }
      .compare-badge.compare-up { color: #2c6b34 !important; }
      .compare-badge.compare-down { color: #8f3226 !important; }
      .compare-badge.compare-empty { color: #4a6ea8 !important; }
      .compare-badge.compare-equal { color: #6c573b !important; }
      #overlay .inventory-row button, #overlay .companion-card button { width: auto; margin: 0; padding: 7px 9px; flex: 0 0 auto; font-size: 11px; }
      .companion-card.active { background: #c8d2ab; border-color: #718150; }
      .companion-avatar { width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; color: #fff0c6; font-weight: bold; border: 2px solid #5c4127; flex: 0 0 auto; }
      .npc-reply { margin: 12px 0; padding: 13px; background: #f4e6c5; border-left: 4px solid #886138; font: 14px/1.6 'Malgun Gothic', sans-serif; color: #34251a; }
      .choice-label, .thinking { font-size: 12px; color: #6b5134; text-align: center; }
      #overlay button.dialogue-choice { margin-top: 7px; text-align: left; background: linear-gradient(#5e4936, #3e2d22); }
      .conversation-count { display: block; margin-top: 10px; color: #826c4c; text-align: center; font-size: 10px; }
      .empty-state { text-align: center; color: #786447; font-size: 12px; padding: 18px 4px; }
      #overlay h3 { margin: 14px 0 6px; color: #4c3420; font-size: 14px; border-bottom: 1px solid #aa8954; padding-bottom: 4px; }
      .status-panel, .forge-panel, .inventory-panel { width: min(430px, 100%) !important; }
      .class-badge { margin: -5px auto 10px; width: fit-content; padding: 3px 12px; border: 1px solid #8d6a39; border-radius: 999px; background: #3b2b21; color: #ffe3a1; font-size: 11px; font-weight: 700; }
      .title-picker { margin: 8px 0; padding: 8px; border: 1px solid #98763f; border-radius: 6px; background: #ead7ad; }
      .title-picker label { margin: 0 0 4px !important; }
      .title-picker small { display: block; margin-top: 4px; color: #70583b; font-size: 9px; }
      #overlay button.fusion-link { margin: 8px 0; background: linear-gradient(#664483, #38284e); border-color: #c69ae2; box-shadow: 0 3px 0 #24130e, 0 0 12px #8e57bd77; }
      .fusion-panel { width: min(430px, 100%) !important; }
      .fusion-guide { padding: 8px; border: 1px solid #9874b7; border-radius: 6px; background: #eadcf0; color: #55386d; font-size: 11px; text-align: center; }
      .fusion-selected { margin: 8px 0; padding: 9px; border: 1px solid #936db5; border-radius: 6px; background: linear-gradient(120deg, #3c294f, #65477d); color: #f8eaff; font-size: 11px; }
      .fusion-selected strong, .fusion-selected small { display: block; }
      .fusion-selected small { color: #e7c8f7; margin-top: 3px; }
      .fusion-list { display: flex; flex-direction: column; gap: 7px; margin: 8px 0; }
      .fusion-card { display: flex; align-items: center; gap: 8px; padding: 8px; border: 1px solid #9d835c; border-radius: 5px; background: #ead8b1; }
      .fusion-card.selected { outline: 2px solid #9a55c5; box-shadow: 0 0 14px #8d52bd88; }
      .fusion-card > div { flex: 1; min-width: 0; }
      .fusion-card strong, .fusion-card small { display: block; }
      .fusion-card strong { font-size: 11px; }
      .fusion-card small { color: #6d5a41; font-size: 9px; }
      #overlay .fusion-card button { width: auto; margin: 0; padding: 7px 9px; font-size: 10px; }
      #overlay button.fusion-submit { background: linear-gradient(#8a4c9e, #4c285d); border-color: #deb0ef; }
      .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; font: 11px 'Malgun Gothic', sans-serif; }
      .stat-grid span { padding: 6px 8px; background: #eddbb6; border: 1px solid #ac8b55; border-radius: 4px; }
      .equipped-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
      .equip-slot { position: relative; min-height: 43px; padding: 6px 7px; border: 1px solid #9b815c; border-radius: 5px; background: #e7d3ab; box-sizing: border-box; font-family: 'Malgun Gothic', sans-serif; }
      .equip-slot > span, .gear-card small, .forge-card small { display: block; color: #6d5a41; font-size: 9px; }
      .equip-slot > strong { display: block; margin-right: 39px; font-size: 10px; line-height: 1.3; }
      #overlay .equip-slot button { position: absolute; right: 5px; bottom: 5px; width: auto; margin: 0; padding: 3px 6px; font-size: 9px; }
      .gear-list, .forge-list { display: flex; flex-direction: column; gap: 7px; margin: 7px 0; }
      .gear-card, .forge-card { display: flex; align-items: center; gap: 8px; padding: 8px; border: 1px solid #9d835c; border-radius: 5px; background: #ead8b1; font-family: 'Malgun Gothic', sans-serif; }
      .gear-card > div, .forge-card > div { flex: 1; min-width: 0; }
      .gear-card strong, .forge-card strong { display: block; font-size: 11px; line-height: 1.35; }
      #overlay .gear-card button, #overlay .forge-card button { width: auto; flex: 0 0 auto; margin: 0; padding: 7px 8px; font-size: 10px; }
      .forge-actions { display: flex; flex-direction: column; gap: 5px; flex: 0 0 auto !important; }
      #overlay .forge-actions button.repair { background: linear-gradient(#4d725f, #29483a); border-color: #8fc29f; }
      #overlay button:disabled { filter: grayscale(.8); opacity: .52; cursor: not-allowed; }
      .forge-risk { margin-top: 3px; color: #8b332c !important; font-weight: 700; }
      .forge-message { padding: 8px; border-radius: 5px; border: 1px solid #a5844f; background: #f5e6bd; font-size: 12px; text-align: center; }
      .forge-message.success { color: #24532c; border-color: #638b58; background: #ccdbb0; }
      .forge-message.fail { color: #7a3328; border-color: #a96d59; background: #e5c1ae; }
      .forge-message.destroyed { color: #ffe0c2; border-color: #da4d3f; background: #542622; box-shadow: 0 0 18px #c6372c99; }
      .astrologer-panel { width: min(430px, 100%) !important; }
      .star-blessing { margin: 7px 0; padding: 8px; border: 1px solid #8a65bd; border-radius: 6px; background: linear-gradient(110deg, #332253, #5f3e83); color: #ffe8a3; text-align: center; font: 700 12px 'Malgun Gothic', sans-serif; box-shadow: 0 0 12px #8d58c777; }
      .star-oracle { margin: 9px 0; padding: 12px; border: 1px solid #9572bc; border-radius: 7px; background: linear-gradient(135deg, #2f2147, #55406d); color: #f8e9ff; text-align: center; font: 13px/1.55 'Malgun Gothic', sans-serif; box-shadow: inset 0 0 18px #bd8ce233, 0 0 14px #734ba655; }
      .star-progress { display: flex; justify-content: center; gap: 10px; margin: 10px 0; }
      .star-progress span { width: 34px; height: 34px; display: grid; place-items: center; border-radius: 50%; border: 1px solid #9676b8; background: #35274a; color: #ad9bbc; font-weight: 700; }
      .star-progress span.done { background: #6e4b92; color: #ffe989; box-shadow: 0 0 10px #d898ff99; }
      .blessing-inventory { display: grid; gap: 5px; margin: 8px 0; }
      .blessing-inventory span { display: flex; justify-content: space-between; padding: 7px 9px; border: 1px solid #9070b2; border-radius: 5px; background: #423056; color: #f6e7ff; font-size: 11px; }
      .blessing-picker { margin: 8px 0; padding: 8px; border: 1px solid #9b78bd; border-radius: 6px; background: #eadcf0; text-align: center; }
      .blessing-picker > strong { display: block; margin-bottom: 6px; color: #53366e; font-size: 12px; }
      .blessing-picker > div { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; }
      #overlay .blessing-picker button { margin: 0; padding: 6px 3px; font-size: 9px; background: linear-gradient(#60457d, #3d2b55); border-color: #a98acc; }
      #overlay .blessing-picker button.active { color: #ffe78e; box-shadow: 0 0 12px #9d59d4, inset 0 0 8px #e4bdff66; }
      #overlay .blessing-picker > button.secondary { width: auto; margin: 6px auto 0; padding: 5px 12px; }
      .star-answers { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; margin: 9px 0; }
      #overlay .star-answers button { margin: 0; background: linear-gradient(#624a80, #3d2b57); border-color: #aa86cd; }
      .rarity-normal { border-color: #96938c !important; }
      .rarity-rare { border-color: #318dd8 !important; box-shadow: inset 3px 0 #4a9fe8; }
      .rarity-unique { border-color: #a447d2 !important; background: linear-gradient(105deg, #e8d5b0, #d9bee5) !important; box-shadow: inset 3px 0 #b45de0, 0 0 8px #a64ed455; }
      .rarity-legendary { border-color: #e78727 !important; background: linear-gradient(105deg, #ebd5a7, #edbf87) !important; box-shadow: inset 3px 0 #f09a38, 0 0 11px #e8792877; animation: rarityPulse 1.8s infinite alternate; }
      .rarity-mythic { border-color: #e8324a !important; background: linear-gradient(115deg, #ecc29b, #e9a9b2, #d9b9ea) !important; box-shadow: inset 3px 0 #ff4f5e, 0 0 14px #ff405e99; animation: rarityPulse 1s infinite alternate; }
      .enhancement-mid { outline: 1px solid #d6b14f; box-shadow: inset 3px 0 #efc75e, 0 0 9px #e8bd5266 !important; }
      .enhancement-high { position: relative; outline: 2px solid #ffd45f; box-shadow: inset 3px 0 #fff0a0, 0 0 16px #ff405eaa, 0 0 25px #ffd45f66 !important; animation: enhancedPulse .75s infinite alternate !important; }
      .enhancement-high::after { content: '✦'; position: absolute; right: 5px; top: 2px; color: #fff2a2; font-size: 12px; text-shadow: 0 0 7px #ff425d; }
      .enhancement-max { position: relative; outline: 2px solid #fff2a0; box-shadow: inset 3px 0 #ffffff, 0 0 20px #ff385cdd, 0 0 32px #ffe55fbb !important; animation: enhancedPulse .42s infinite alternate !important; }
      .enhancement-max::after { content: '♛'; position: absolute; right: 5px; top: 1px; color: #fff5aa; font-size: 14px; text-shadow: 0 0 8px #ff334f; }

      @keyframes enhancedPulse { from { filter: brightness(.98) saturate(1.05); } to { filter: brightness(1.22) saturate(1.35); } }
      .quest-panel { width: min(430px, 100%) !important; }
      .quest-list, .milestone-list { display: flex; flex-direction: column; gap: 7px; margin: 8px 0; }
      .quest-card, .milestone-card { padding: 8px; border: 1px solid #9d835c; border-radius: 5px; background: #ead8b1; font-family: 'Malgun Gothic', sans-serif; }
      .quest-card strong, .milestone-card strong { display: block; font-size: 12px; margin-bottom: 3px; }
